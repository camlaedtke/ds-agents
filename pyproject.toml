[project]
name = "ds-agents"
version = "0.1.0"
description = "Multi-agent data science pipeline with an adversarial reviewer and an eval harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.1",
    "pandas>=2.2",
]

[project.scripts]
ds-agents = "ds_agents.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: unit tests on fixed fixtures, no model calls, no container. Runs on every edit.",
]
addopts = "--strict-markers"
